services:
  backend:
    build: ./backend
    container_name: local-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/app/storage:/app/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: local-rag-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
